    <!-- MODAL IMPORTAR EXCEL -->
    <div class="modal fade" id="modalImportarExcel" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header text-white border-0 px-4 py-3" style="background: linear-gradient(110deg,#8b1d2c,#68121e);">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-file-earmark-excel-fill text-warning fs-5"></i>
                        <div>
                            <h5 class="modal-title fw-bold m-0 text-white fs-6">Importación de Vecinos</h5>
                            <small class="text-white-50" style="font-size: 0.75rem;">Carga masiva de registros vecinales desde formato XLSX o CSV</small>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="importWizardContent1" class="text-center p-4 border rounded bg-light"
                        style="cursor:pointer;" onclick="document.getElementById('importFileInput').click()">
                        <i class="bi bi-cloud-arrow-up text-primary fs-1"></i>
                        <h5 class="fw-bold mt-2">Seleccione archivo Excel (.xlsx, .xls, .csv)</h5>
                        <input type="file" id="importFileInput" accept=".xlsx, .xls, .csv" style="display:none;"
                            onchange="procesarArchivoExcelSubido(this)">
                    </div>
                    <div id="importWizardContent2" style="display:none;" class="mt-3">
                        <div class="alert alert-info py-2 small">Archivo leído: <strong
                                id="lblNombreArchivoCargado"></strong> (<span id="lblTotalFilasCargadas"></span>
                            registros)</div>
                        <button class="btn btn-muni-red w-100 fw-bold rounded-pill text-white" id="btnConfirmarImportacion"
                            onclick="ejecutarImportacionFinal()">Importar Registros</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO VECINO -->
    <div class="modal fade" id="modalVecino" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header text-white border-0 px-4 py-3" style="background: linear-gradient(110deg,#8b1d2c,#68121e);">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-person-fill text-warning fs-5"></i>
                        <div>
                            <h5 class="modal-title fw-bold m-0 text-white fs-6" id="modalVecinoTitle">Registrar Vecino</h5>
                            <small class="text-white-50" style="font-size: 0.75rem;">Registro y actualización de datos de vecinos en el padrón</small>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formVecino" novalidate onsubmit="guardarVecino(event)">
                        <input type="hidden" id="vecinoId">
                        <div class="mb-2"><label for="vecinoRut" class="form-label small fw-bold">RUT</label><input type="text"
                                class="form-control form-control-sm" id="vecinoRut" maxlength="15" required></div>
                        <div class="mb-2"><label for="vecinoEmail" class="form-label small fw-bold">Correo electrónico (opcional)</label><input type="email"
                                class="form-control form-control-sm" id="vecinoEmail" maxlength="254" autocomplete="email"></div>
                        <div class="mb-2"><label for="vecinoNombre" class="form-label small fw-bold">Nombre Completo</label><input
                                type="text" class="form-control form-control-sm" id="vecinoNombre" maxlength="150" required></div>
                        <div class="mb-2"><label for="vecinoDireccion" class="form-label small fw-bold">Dirección</label><input type="text"
                                class="form-control form-control-sm" id="vecinoDireccion" maxlength="255" required></div>
                        <div class="mb-2"><label for="vecinoTelefono" class="form-label small fw-bold">Teléfono (opcional)</label><input type="tel"
                                class="form-control form-control-sm" id="vecinoTelefono" maxlength="20" autocomplete="tel"></div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="vecinoTerritorio" class="form-label small fw-bold">Territorio</label>
                                <select class="form-select form-select-sm" id="vecinoTerritorio">
                                    {% for delegation in delegations %}<option value="{{ delegation.name }}">{{ delegation.name }}</option>{% endfor %}
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="vecinoEstado" class="form-label small fw-bold">Estado</label>
                                <select class="form-select form-select-sm" id="vecinoEstado">
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-3 pt-2 border-top">
                            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-muni-red rounded-pill px-4 py-1 btn-sm fw-bold">
                                <i class="bi bi-cloud-arrow-up-fill me-1"></i> Guardar Vecino
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
