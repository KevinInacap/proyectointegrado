<!-- Top Header con Línea Institucional Roja de 3px -->
<header class="top-header">
            <div class="header-left">
                <button class="btn-hamburger" onclick="toggleSidebar()" title="Alternar menú lateral" aria-label="Alternar menú lateral" aria-controls="sidebar" aria-expanded="false">
                    <i class="bi bi-list"></i>
                </button>
                <div class="header-title-wrapper">
                    <span class="header-sys-name">Sistema Municipal</span>
                    <span class="header-sys-divider">|</span>
                    <span class="header-sub-name">Gestión de Atención Ciudadana</span>
                </div>
            </div>

            <div class="header-right">
                <!-- Dropdown de Notificaciones Administrativas & Seguridad de Personal -->
                <div class="dropdown">
                    <button class="btn-notification" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Centro de Notificaciones Administrativas">
                        <i class="bi bi-bell"></i>
                        <span class="badge-count" id="adminNotifBadge" hidden>0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 mt-2 p-0 admin-notif-dropdown" style="min-width: 360px; max-width: 400px;">
                        <div class="notif-header d-flex align-items-center justify-content-between p-3 border-bottom">
                            <div>
                                <h6 class="m-0 fw-bold" style="color: var(--muni-navy); font-size: 0.9rem;">
                                    <i class="bi bi-shield-lock-fill text-danger me-1"></i> Alertas de Funcionarios
                                </h6>
                                <span class="text-muted" style="font-size: 0.72rem;">Solicitudes y avisos del equipo municipal</span>
                            </div>
                            <button class="btn btn-sm btn-link text-decoration-none p-0 fw-semibold" onclick="marcarNotificacionesLeidas()" style="font-size: 0.75rem; color: var(--muni-red);">
                                Marcar leídas
                            </button>
                        </div>
                        <div class="notif-list-body" id="adminNotifList">
                            <div class="p-4 text-center text-secondary small">
                                <i class="bi bi-bell-slash d-block fs-4 mb-2" aria-hidden="true"></i>
                                No hay solicitudes nuevas.
                            </div>
                        </div>
                        <div class="notif-footer p-2 text-center bg-light rounded-bottom-4">
                            <a href="javascript:void(0)" onclick="abrirModalAuditoria()" class="small text-decoration-none fw-semibold" style="color: var(--muni-navy); font-size: 0.75rem;">
                                Ver Registro de Trazabilidad <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="user-dropdown-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="user-avatar-img" aria-hidden="true">{{ user_name|default:user.get_full_name|default:user.username|slice:":1"|upper }}</span>
                        <span class="user-identity">
                            <span class="user-info-text">{{ user_name|default:user.get_full_name|default:user.username|default:'Usuario Municipal' }}</span>
                            <span class="user-context-text">
                                {{ user_role|default:'Sin rol asignado' }}
                                <span aria-hidden="true">•</span>
                                {% if delegation_code %}{{ delegation_code }} · {% endif %}{{ current_delegation|default:'Sin delegación asignada' }}
                            </span>
                        </span>
                        <i class="bi bi-chevron-down text-muted ms-1" style="font-size: 0.72rem;"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 mt-2"
                        style="min-width: 200px;">
                        <li><span class="dropdown-header text-uppercase small fw-bold text-danger">Municipalidad La
                                Serena</span></li>
                        <li><a class="dropdown-item py-2 fw-semibold text-secondary" href="javascript:void(0)"
                                onclick="abrirModalPerfil()"><i class="bi bi-person-badge-fill me-2 text-primary"></i>
                                Mi Perfil</a></li>
                        <li><a class="dropdown-item py-2 fw-semibold text-secondary" href="javascript:void(0)"
                                onclick="abrirModalAuditoria()"><i class="bi bi-clock-history me-2 text-primary"></i>
                                Auditoría de Cambios</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item py-2 fw-semibold text-danger" href="{% url 'core:logout' %}"><i
                                    class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </header>
