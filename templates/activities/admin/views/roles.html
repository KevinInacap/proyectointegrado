<section id="view-roles" class="maintainer-view">
                <div class="liquid-glass-card">
                    <!-- Header Oficial (Fiel al PDF) -->
                    <div
                        class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4 pb-2 border-bottom">
                        <div>
                            <h2 class="m-0 fw-bold"
                                style="color: var(--muni-navy); font-size: 1.65rem; letter-spacing: -0.3px;">Roles</h2>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-3 py-1 fw-semibold small" onclick="exportarExcelRoles()">Exportar a Excel</button>
                            <button class="btn btn-outline-secondary rounded-pill px-3 py-1 fw-semibold small"
                                onclick="abrirModalMatrizMyAdmin()" title="Ver matriz completa de permisos">
                                <i class="bi bi-grid-3x3 me-1"></i> Matriz de Permisos
                            </button>
                            <button id="btnNuevoRol" class="liquid-glass-btn-primary" onclick="abrirModalRol('nuevo')" disabled>
                                <i class="bi bi-plus-lg me-1"></i> Nuevo Rol
                            </button>
                        </div>
                    </div>

                    <!-- MATRIZ VISUAL DE PERMISOS Y TARJETAS DE ROLES -->
                    <div class="role-cards-grid mb-4" id="roleCardsLive" data-ready="false" aria-live="polite">
                        <div class="admin-loading" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Cargando roles y permisos…</div>
                    </div>

                    <!-- Barra de Búsqueda y Filtro (Idéntica al PDF) -->
                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
                        <div class="d-flex align-items-center gap-2" style="flex-grow: 1; max-width: 480px;">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i
                                        class="bi bi-search"></i></span>
                                <input type="text" class="form-control border-start-0" id="searchRolesInput"
                                    oninput="filtrarRoles()" placeholder="Buscar por nombre, descripción o permiso">
                            </div>
                            <select class="form-select form-select-sm" id="filtroTipoRol" onchange="filtrarRoles()"
                                style="width: auto;">
                                <option value="">Todos los roles</option>
                                <option value="sistema">Roles de sistema</option>
                                <option value="personalizado">Roles personalizados</option>
                            </select>
                        </div>
                        <div class="text-secondary small">
                            <span id="lblTotalRoles" class="fw-bold text-dark">10</span> roles configurados
                        </div>
                    </div>

                    <!-- Tabla Principal de Roles (Coincidente con PDF: # | Nombre | Descripción | Permisos | Acciones) -->
                    <div class="table-responsive">
                        <table class="liquid-roles-table" id="tablaRoles">
                            <thead>
                                <tr>
                                    <th style="width: 50px; text-align: center;">#</th>
                                    <th style="min-width: 170px;">Nombre</th>
                                    <th style="min-width: 250px;">Descripción</th>
                                    <th style="min-width: 240px;">Permisos Asignados</th>
                                    <th style="width: 100px; text-align: center;">Usuarios</th>
                                    <th style="width: 110px; text-align: end;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaRolesBody">
                                <tr>
                                    <td colspan="6" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status">
                                        </div>
                                        Cargando roles...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Paginador y Contador de Roles -->
                    <div class="table-pagination-footer mt-3">
                        <div class="d-flex align-items-center gap-2">
                            <span>Mostrar</span>
                            <select class="form-select form-select-sm" style="width: 70px;"
                                id="selectFilasPorPaginaRoles" onchange="cambiarFilasPorPaginaRoles(this.value)">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                            <span id="lblRegistrosInfoRoles" class="small">Cargando registros...</span>
                        </div>
                        <div class="pagination-pills" id="paginadorPillsRoles"></div>
                    </div>
                </div>
            </section>
